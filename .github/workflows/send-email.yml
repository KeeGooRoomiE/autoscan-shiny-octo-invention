name: Send Pamyatka Email

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: 'Email получателя (менеджера)'
        required: true
      manager_name:
        description: 'Имя менеджера'
        required: true
      system:
        description: 'Система (axenta / glonass / wialon)'
        required: true
      login:
        description: 'Логин пользователя'
        required: true
      password:
        description: 'Пароль пользователя'
        required: true

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # workflow_dispatch inputs are never masked by GitHub automatically —
      # only values already registered as secrets are. login/password here
      # are a client's real monitoring-system credentials, not a repo
      # secret, so without this they print in plaintext in the "Send email"
      # step's auto-logged env: block (and anywhere else they might be
      # echoed). Registering them via ::add-mask:: here masks every
      # occurrence for the rest of this job, including that env: dump.
      - name: Mask client credentials
        run: |
          echo "::add-mask::${{ github.event.inputs.login }}"
          echo "::add-mask::${{ github.event.inputs.password }}"

      - name: Send email
        env:
          RECIPIENT:    ${{ github.event.inputs.recipient }}
          MANAGER_NAME: ${{ github.event.inputs.manager_name }}
          SYSTEM:       ${{ github.event.inputs.system }}
          DOC_LOGIN:    ${{ github.event.inputs.login }}
          DOC_PASSWORD: ${{ github.event.inputs.password }}
          SENDER_EMAIL: ${{ secrets.MANAGER1_EMAIL }}
          SENDER_PASS:  ${{ secrets.MANAGER1_PASS }}
        run: python send_email.py