<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Памятка пользователю</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&display=swap');
:root { --blue: #1a56a0; --border: #d0dcea; --muted: #6b7f9a; --text: #1a2a4a; --green: #1e9e52; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Golos Text', sans-serif; background: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: stretch; }
.site-header { display: flex; justify-content: flex-start; }
.site-header img { width: 1024px; max-width: 100%; display: block; }
.site-footer { display: flex; justify-content: flex-end; }
.site-footer img { width: 1024px; max-width: 100%; display: block; }
.main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 40px 32px 48px; gap: 24px; }
.panel-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.4px; margin-bottom: 16px; }
.form-block { width: 100%; max-width: 480px; display: flex; flex-direction: column; }
.field-label { font-size: 11px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 5px; }
.field-input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 7px; font-family: inherit; font-size: 15px; color: var(--text); outline: none; transition: border-color .18s, box-shadow .18s; background: #fafcff; margin-bottom: 16px; }
.field-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,86,160,.10); background: #fff; }
.field-input::placeholder { color: #b0bfcc; }
.divider { height: 1px; background: var(--border); width: 100%; max-width: 480px; }
.section-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 12px; }
.system-btns { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 480px; }
.radio-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; border-radius: 8px; border: 2px solid #e0e6ee; background: #f6f8fa; cursor: pointer; transition: all .18s; user-select: none; }
.radio-btn input[type=radio] { position: absolute; opacity: 0; width: 0; height: 0; }
.radio-circle { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #c0ccd8; background: #fff; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: border-color .18s, background .18s; }
.radio-circle::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: 0; transition: opacity .18s; }
.btn-label { font-size: 14px; font-weight: 700; letter-spacing: .6px; color: #b0bec5; transition: color .18s; }
.radio-btn.checked { border-color: var(--blue); background: #fff; box-shadow: 0 4px 14px rgba(26,86,160,.15); }
.radio-btn.checked .radio-circle { border-color: var(--blue); background: var(--blue); }
.radio-btn.checked .radio-circle::after { opacity: 1; }
.radio-btn.checked .btn-label { color: var(--text); }
.status-msg { font-size: 12px; color: #e74c3c; min-height: 16px; text-align: center; }
.email-panel { width: 100%; max-width: 480px; background: #f4f7fb; border: 1.5px solid var(--border); border-radius: 10px; padding: 20px; display: none; flex-direction: column; }
.email-panel.visible { display: flex; }
.email-panel .panel-title { margin-bottom: 14px; }
.manager-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
.manager-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; border-radius: 8px; border: 2px solid #e0e6ee; background: #fff; cursor: pointer; transition: all .18s; user-select: none; }
.manager-btn .radio-circle { width: 16px; height: 16px; border: 2px solid #c0ccd8; border-radius: 50%; background: #fff; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: border-color .18s, background .18s; }
.manager-btn .radio-circle::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: 0; transition: opacity .18s; }
.manager-btn .manager-info { display: flex; flex-direction: column; gap: 1px; }
.manager-btn .manager-name { font-size: 13px; font-weight: 700; color: #b0bec5; transition: color .18s; }
.manager-btn .manager-email { font-size: 11px; color: #c0ccd8; transition: color .18s; }
.manager-btn.checked { border-color: var(--blue); box-shadow: 0 2px 10px rgba(26,86,160,.12); }
.manager-btn.checked .radio-circle { border-color: var(--blue); background: var(--blue); }
.manager-btn.checked .radio-circle::after { opacity: 1; }
.manager-btn.checked .manager-name { color: var(--text); }
.manager-btn.checked .manager-email { color: var(--muted); }
.email-status { font-size: 12px; min-height: 16px; text-align: center; margin-top: 8px; }
.email-status.error { color: #e74c3c; }
.email-status.ok { color: var(--green); }
.btn { width: 100%; max-width: 480px; padding: 13px; border: none; border-radius: 9px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: .4px; transition: background .18s, transform .1s; display: none; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.btn.visible { display: block; }
.btn-email { background: var(--blue); color: #fff; box-shadow: 0 4px 16px rgba(26,86,160,.20); }
.btn-email:hover:not(:disabled) { background: #154988; }
</style>
</head>
<body>

<div class="site-header"><img src="header.jpg" alt="АвтоСкан"></div>

<div class="main">
  <div class="form-block">
    <div class="panel-title">Данные пользователя</div>
    <div class="field-label">Логин</div>
    <input class="field-input" id="userField" type="text" placeholder="Введите логин" oninput="update()">
    <div class="field-label">Пароль</div>
    <input class="field-input" id="passField" type="text" placeholder="Введите пароль" oninput="update()">
  </div>

  <div class="divider"></div>

  <div style="width:100%;max-width:480px;">
    <div class="section-label">Система мониторинга</div>
    <div class="system-btns">
      <label class="radio-btn" id="rb-axenta" onclick="selectSystem('axenta')">
        <input type="radio" name="system" value="axenta">
        <span class="radio-circle"></span>
        <span class="btn-label">АКСЕНТА</span>
      </label>
      <label class="radio-btn" id="rb-glonass" onclick="selectSystem('glonass')">
        <input type="radio" name="system" value="glonass">
        <span class="radio-circle"></span>
        <span class="btn-label">ГЛОНАСССОФТ</span>
      </label>
      <label class="radio-btn" id="rb-wialon" onclick="selectSystem('wialon')">
        <input type="radio" name="system" value="wialon">
        <span class="radio-circle"></span>
        <span class="btn-label">WIALON LOCAL</span>
      </label>
    </div>
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <button class="btn btn-email" id="btnEmail" onclick="toggleEmailPanel()">Отправить менеджеру</button>

  <div class="email-panel" id="emailPanel">
    <div class="panel-title">Выберите менеджера</div>
    <div class="manager-list" id="managerList"></div>
    <div class="email-status" id="emailStatus"></div>
    <button class="btn btn-email" id="btnSend" onclick="sendEmail()" style="margin-top:14px;display:block;max-width:100%;">Отправить</button>
  </div>
</div>

<div class="site-footer"><img src="footer.jpg" alt="АвтоСкан"></div>

<script>
const MANAGERS = [
  { name: 'Матвиенко Кирилл',     email: 'kop5@navi42.ru' },
  { name: 'Лазуркевич Арина',     email: 'kop1@navi42.ru' },
  { name: 'Штанов Андрей',        email: 'kop2@navi42.ru' },
  { name: 'Осинцев Евгений',      email: 'kop4@navi42.ru' },
  { name: 'Пушкарева Юлия',       email: 'kop3@navi42.ru' },
  { name: 'Петрушин Станислав',   email: 'pso@navi42.ru' },
  { name: 'Баумштарк Марк',       email: 'service@navi42.ru' },
  { name: 'Гусаров Александр',   email: 'zvv@navi42.ru' },
];

const GH_TOKEN    = 'YOUR_FINE_GRAINED_PAT_HERE';
const GH_REPO     = 'KeeGooRoomiE/autoscan-shiny-octo-invention';
const GH_WORKFLOW = 'send-email.yml';

let currentSystem  = null;
let currentManager = null;

// Build manager list
const list = document.getElementById('managerList');
MANAGERS.forEach((m, i) => {
  const btn = document.createElement('div');
  btn.className = 'manager-btn';
  btn.id = 'mb-' + i;
  btn.innerHTML = `
    <span class="radio-circle"></span>
    <span class="manager-info">
      <span class="manager-name">${m.name}</span>
      <span class="manager-email">${m.email}</span>
    </span>`;
  btn.onclick = () => selectManager(i);
  list.appendChild(btn);
});

function selectManager(i) {
  currentManager = i;
  document.querySelectorAll('.manager-btn').forEach(b => b.classList.remove('checked'));
  document.getElementById('mb-' + i).classList.add('checked');
  document.getElementById('emailStatus').textContent = '';
}

function selectSystem(key) {
  currentSystem = key;
  document.querySelectorAll('.radio-btn').forEach(el => el.classList.remove('checked'));
  document.getElementById('rb-' + key).classList.add('checked');
  update();
}

function update() {
  const user = document.getElementById('userField').value.trim();
  const pass = document.getElementById('passField').value.trim();
  const ok = user && pass && currentSystem;
  let msg = '';
  if (user || pass || currentSystem) {
    if (!currentSystem) msg = 'Выберите систему мониторинга';
    else if (!user || !pass) msg = 'Заполните оба поля';
  }
  document.getElementById('statusMsg').textContent = msg;
  document.getElementById('btnEmail').classList.toggle('visible', !!ok);
  if (!ok) document.getElementById('emailPanel').classList.remove('visible');
}

function toggleEmailPanel() {
  const panel = document.getElementById('emailPanel');
  panel.classList.toggle('visible');
  if (panel.classList.contains('visible'))
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function sendEmail() {
  if (currentManager === null) { setEmailStatus('Выберите менеджера', 'error'); return; }
  const user    = document.getElementById('userField').value.trim();
  const pass    = document.getElementById('passField').value.trim();
  const manager = MANAGERS[currentManager];
  const btn     = document.getElementById('btnSend');

  btn.textContent = 'Отправляю...'; btn.disabled = true;
  setEmailStatus('', '');

  try {
    const resp = await fetch(
      `https://api.github.com/repos/${GH_REPO}/actions/workflows/${GH_WORKFLOW}/dispatches`,
      {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${GH_TOKEN}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          ref: 'main',
          inputs: {
            recipient:    manager.email,
            manager_name: manager.name,
            system:       currentSystem,
            login:        user,
            password:     pass,
          }
        })
      }
    );
    if (resp.status === 204) {
      setEmailStatus(`Отправлено → ${manager.name} ✓`, 'ok');
      currentManager = null;
      document.querySelectorAll('.manager-btn').forEach(b => b.classList.remove('checked'));
    } else {
      const err = await resp.json().catch(() => ({}));
      setEmailStatus('Ошибка: ' + (err.message || resp.status), 'error');
    }
  } catch(e) {
    setEmailStatus('Ошибка сети: ' + e.message, 'error');
  }
  btn.textContent = 'Отправить'; btn.disabled = false;
}

function setEmailStatus(msg, type) {
  const el = document.getElementById('emailStatus');
  el.textContent = msg;
  el.className = 'email-status' + (type ? ' ' + type : '');
}
</script>
</body>
</html>
